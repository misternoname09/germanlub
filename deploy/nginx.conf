# =============================================================
# Nginx Configuration — GermanLub Shop
# VPS OVH (Ubuntu 22.04/24.04)
#
# Installation :
#   sudo cp nginx.conf /etc/nginx/sites-available/germanlub
#   sudo ln -sf /etc/nginx/sites-available/germanlub /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# IMPORTANT : Remplacez VOTRE_DOMAINE.com par votre vrai domaine !
# =============================================================

# Redirection www → non-www (optionnel, à adapter selon préférence)
server {
    listen 80;
    server_name www.germanlub.com;
    return 301 http://germanlub.com$request_uri;
}

server {
    listen 80;
    server_name germanlub.com;

    # ─── Frontend Angular (SPA) ───
    root /var/www/germanlub/frontend/dist/frontend/browser;
    index index.html;

    # Toutes les routes Angular → index.html (SPA routing)
    location / {
        try_files $uri $uri/ /index.html;
        
        # Cache pour les assets hashés (Angular outputHashing: 'all')
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # ─── Backend Django API ───
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout pour les requêtes longues (génération PDF, etc.)
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # ─── Admin Django ───
    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── Médias uploadés (images produits, blog, factures) ───
    location /media/ {
        alias /var/www/germanlub/backend/media/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # ─── Fichiers statiques Django (admin CSS/JS) ───
    location /static/ {
        alias /var/www/germanlub/backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Taille max upload (images produits ~5Mo max)
    client_max_body_size 10M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
}
